name: OpenUsage

options:
  bundleIdPrefix: com.qbapps
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: false

# Local SwiftPM package holding every non-UI piece of the app. A future widget
# extension links this same product directly.
packages:
  OpenUsageCore:
    path: OpenUsageCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO

targets:
  OpenUsage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenUsage
        excludes:
          - "Info.plist"
    dependencies:
      - package: OpenUsageCore
        product: OpenUsageCore
    settings:
      base:
        PRODUCT_NAME: OpenUsage
        PRODUCT_BUNDLE_IDENTIFIER: com.qbapps.claudeusage
        INFOPLIST_FILE: OpenUsage/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "7"
        # 1 = iPhone only. Change to "1,2" to also ship iPad.
        TARGETED_DEVICE_FAMILY: "1"
        # Automatic signing with a free personal Apple ID team. Set
        # DEVELOPMENT_TEAM here (or pick your team in Xcode's Signing &
        # Capabilities tab) before installing to a device.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  OpenUsage:
    build:
      targets:
        OpenUsage: all
    run:
      config: Debug
    archive:
      config: Release
